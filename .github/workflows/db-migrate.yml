name: Production Deployment and DB Migrations

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy_and_migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy to Hostinger
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private key safely
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key

          # Clean environment variables
          CLEAN_HOST=$(echo "$HOSTINGER_HOST" | tr -d '\r\n ')
          CLEAN_PORT=$(echo "$HOSTINGER_PORT" | tr -d '\r\n ')
          CLEAN_USER=$(echo "$HOSTINGER_USER" | tr -d '\r\n ')

          # Populate known_hosts
          ssh-keyscan -p "$CLEAN_PORT" "$CLEAN_HOST" >> ~/.ssh/known_hosts

          # Test SSH connection
          echo "Testing SSH connection to $CLEAN_USER@$CLEAN_HOST:$CLEAN_PORT..."
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$CLEAN_PORT" \
            -o StrictHostKeyChecking=yes \
            "$CLEAN_USER@$CLEAN_HOST" \
            'echo HOSTINGER_SSH_CONNECTED_OK'

          # Check if Hostinger is a git repository and sync if possible
          echo "Checking Git status on Hostinger..."
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$CLEAN_PORT" \
            -o StrictHostKeyChecking=yes \
            "$CLEAN_USER@$CLEAN_HOST" \
            'cd /home/u914531711/domains/anantamtptl.com/public_html && if [ -d .git ]; then echo "GIT FOUND: Pulling latest..."; git fetch origin main && git reset --hard origin/main; else echo "NO .GIT in public_html"; fi'

          # Sync all files to Hostinger (preserving connection credentials and logs)
          echo "Deploying repository files via rsync..."
          rsync -avz \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'error.log' \
            --exclude '*.log' \
            --exclude 'common/connection.php' \
            --exclude 'dashboard/admin/common/connection.php' \
            --exclude 'dashboard/user1/common/connection.php' \
            --exclude 'dashboard/use r/common/connection.php' \
            --exclude 'dashboard1 1/' \
            -e "ssh -i ~/.ssh/hostinger_key -p $CLEAN_PORT -o StrictHostKeyChecking=yes" \
            ./ "$CLEAN_USER@$CLEAN_HOST:/home/u914531711/domains/anantamtptl.com/public_html/"

          # Run database migrations on Hostinger
          echo "Executing production database migrations..."
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$CLEAN_PORT" \
            -o StrictHostKeyChecking=yes \
            "$CLEAN_USER@$CLEAN_HOST" \
            'cd /home/u914531711/domains/anantamtptl.com/public_html && php database/migration.php migrate'

          # Run deep diagnostic script on Hostinger
          echo "Executing deep diagnostic script on Hostinger..."
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$CLEAN_PORT" \
            -o StrictHostKeyChecking=yes \
            "$CLEAN_USER@$CLEAN_HOST" \
            'cd /home/u914531711/domains/anantamtptl.com/public_html && php dashboard/user1/diag_deep.php key=aX9zK7mQ'
