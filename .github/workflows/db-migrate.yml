name: Production Deployment and DB Migrations

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy_and_migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy to Hostinger
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private key safely
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key

          # Clean environment variables
          CLEAN_HOST=$(echo "$HOSTINGER_HOST" | tr -d '\r\n ')
          CLEAN_PORT=$(echo "$HOSTINGER_PORT" | tr -d '\r\n ')
          CLEAN_USER=$(echo "$HOSTINGER_USER" | tr -d '\r\n ')

          # Populate known_hosts safely
          ssh-keyscan -p "$CLEAN_PORT" "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Resilient SSH Options
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=15"

          # Test SSH connection with retries
          echo "Testing SSH connection to $CLEAN_USER@$CLEAN_HOST:$CLEAN_PORT..."
          CONNECTED=0
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/hostinger_key -p "$CLEAN_PORT" $SSH_OPTS "$CLEAN_USER@$CLEAN_HOST" 'echo HOSTINGER_SSH_CONNECTED_OK'; then
              echo "SSH connected successfully on attempt $i"
              CONNECTED=1
              break
            fi
            echo "SSH attempt $i failed, retrying in 7 seconds..."
            sleep 7
          done

          if [ $CONNECTED -ne 1 ]; then
            echo "ERROR: Failed to establish SSH connection to Hostinger after 3 attempts."
            exit 1
          fi

          # Check if Hostinger is a git repository and sync if possible (non-fatal)
          echo "Checking Git status on Hostinger..."
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$CLEAN_PORT" \
            $SSH_OPTS \
            "$CLEAN_USER@$CLEAN_HOST" \
            'cd /home/u914531711/domains/anantamtptl.com/public_html && mkdir -p assets && if [ -d .git ]; then echo "GIT FOUND: Pulling latest..."; (git fetch origin main && git reset --hard origin/main) || echo "Git pull skipped on server, deploying via rsync..."; else echo "NO .GIT in public_html"; fi'

          # Sync all files to Hostinger (preserving connection credentials, uploads, and logs)
          echo "Deploying repository files via rsync..."
          rsync -av \
            --whole-file \
            --checksum \
            --no-owner \
            --no-group \
            --omit-dir-times \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'error.log' \
            --exclude '*.log' \
            --exclude 'common/connection.php' \
            --exclude 'dashboard/admin/common/connection.php' \
            --exclude 'dashboard/user1/common/connection.php' \
            --exclude 'dashboard/use r/common/connection.php' \
            --exclude 'dashboard1 1/' \
            --exclude 'scratch/' \
            --exclude 'particles.js-master/' \
            --exclude '*.sqlite' \
            --exclude '*.zip' \
            --exclude '*.tar' \
            --exclude '.DS_Store' \
            --exclude 'dashboard/uploads/' \
            -e "ssh -i ~/.ssh/hostinger_key -p $CLEAN_PORT $SSH_OPTS" \
            ./ "$CLEAN_USER@$CLEAN_HOST:/home/u914531711/domains/anantamtptl.com/public_html/"

          # Run database migrations on Hostinger
          echo "Executing production database migrations..."
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$CLEAN_PORT" \
            $SSH_OPTS \
            "$CLEAN_USER@$CLEAN_HOST" \
            'cd /home/u914531711/domains/anantamtptl.com/public_html && php database/migration.php migrate'


