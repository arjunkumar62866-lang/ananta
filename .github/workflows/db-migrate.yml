name: Production DB Migrations

on:
  push:
    branches:
      - main

concurrency:
  group: production-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Hostinger deployment
        run: sleep 60

      - name: Run database migrations on Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key

          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/hostinger_key \
            -p "$HOSTINGER_PORT" \
            -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            'cd /home/u914531711/domains/anantamtptl.com/public_html && php database/migration.php migrate'